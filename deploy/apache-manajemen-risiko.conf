#     ServerName monevrkpd.tegalkota.go.id
#
#     SSLEngine on
#     SSLCertificateFile    /etc/ssl/certs/monevrkpd.tegalkota.go.id.crt
#     SSLCertificateKeyFile /etc/ssl/private/monevrkpd.tegalkota.go.id.key
#
#     # ... (aplikasi monev lain di root '/') ...
#
#     ProxyPreserveHost On
#     ProxyPass        /manajemen-risiko/api/ http://127.0.0.1:8077/api/ timeout=120 retry=0
#     ProxyPassReverse /manajemen-risiko/api/ http://127.0.0.1:8077/api/
#     RequestHeader set X-Forwarded-Proto  "https"
#     RequestHeader set X-Forwarded-Prefix "/manajemen-risiko"
#
#     Alias /manajemen-risiko /var/www/manajemen-risiko/dist
#     <Directory /var/www/manajemen-risiko/dist>
#         Require all granted
#         Options -Indexes +FollowSymLinks
#         AllowOverride None
#         FallbackResource /manajemen-risiko/index.html
#     </Directory>
#     <Directory /var/www/manajemen-risiko/dist/assets>
#         Header set Cache-Control "public, immutable, max-age=2592000"
#     </Directory>
#
#     ErrorLog  ${APACHE_LOG_DIR}/manajemen-risiko-error.log
#     CustomLog ${APACHE_LOG_DIR}/manajemen-risiko-access.log combined
# </VirtualHost>
#
# Setelah edit:  sudo apachectl configtest && sudo systemctl reload apache2
