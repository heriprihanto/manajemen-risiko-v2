# =============================================================================
# Apache httpd — Aplikasi Manajemen Risiko (SPIP) Kota Tegal
# Dilayani di sub-path: https://monevrkpd.tegalkota.go.id/manajemen-risiko/
#
# Frontend : Vue SPA hasil `npm run build` (FrontEnd/dist), base '/manajemen-risiko/'
# Backend  : FastAPI/uvicorn di 127.0.0.1:8077 (prefix internal /api)
#
# Modul yang dibutuhkan (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http headers rewrite expires deflate
#   sudo systemctl restart apache2
# (RHEL/CentOS: pastikan mod_proxy, mod_proxy_http, mod_headers aktif di httpd.conf)
# =============================================================================

# ------- Sisipkan blok berikut ke dalam <VirtualHost *:443> domain Anda ------

# --- 1. API backend --------------------------------------------------------
# Pemetaan '/manajemen-risiko/api/'  ->  'http://127.0.0.1:8077/api/'
# secara efektif MENGUPAS prefix '/manajemen-risiko' (backend tetap lihat /api/...).
# Jangan proxy path frontend — hanya sub-path /api/.
ProxyPreserveHost On
ProxyPass         /manajemen-risiko/api/  http://127.0.0.1:8077/api/  timeout=120 retry=0
ProxyPassReverse  /manajemen-risiko/api/  http://127.0.0.1:8077/api/
# Teruskan skema asli (HTTPS) agar backend tahu di balik TLS.
RequestHeader set X-Forwarded-Proto  "https"
RequestHeader set X-Forwarded-Prefix "/manajemen-risiko"

# --- 2. Frontend SPA (file statis) -----------------------------------------
Alias /manajemen-risiko  /var/www/manajemen-risiko/dist

<Directory /var/www/manajemen-risiko/dist>
    Require all granted
    Options -Indexes +FollowSymLinks
    AllowOverride None

    # History mode: setiap path yang bukan file nyata -> index.html.
    # (mod_proxy sudah menangani /api/ lebih dulu, jadi tidak terpengaruh.)
    FallbackResource /manajemen-risiko/index.html
</Directory>

# Aset ber-hash aman di-cache lama; index.html jangan di-cache.
<Directory /var/www/manajemen-risiko/dist/assets>
    Header set Cache-Control "public, immutable, max-age=2592000"
</Directory>

# =============================================================================
# Contoh <VirtualHost> lengkap (pakai bila belum ada, atau untuk referensi).
# Hapus/komentari bila Anda hanya menyisipkan blok di atas ke vhost yang ada.
# =============================================================================
