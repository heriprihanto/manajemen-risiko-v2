# =============================================================================
# Nginx — Aplikasi Manajemen Risiko (SPIP) Kota Tegal
# Dilayani di sub-path: https://monevrkpd.tegalkota.go.id/manajemen-risiko/
#
# Frontend : Vue SPA hasil `npm run build` (FrontEnd/dist), base '/manajemen-risiko/'
# Backend  : FastAPI/uvicorn di 127.0.0.1:8077 (prefix internal /api)
#
# Cara pakai:
#   1. Build frontend  : cd FrontEnd && npm ci && npm run build
#   2. Salin dist ke   : /var/www/manajemen-risiko/dist  (sesuaikan root di bawah)
#   3. Jalankan backend : uvicorn app.main:app --host 127.0.0.1 --port 8077
#      (disarankan lewat systemd — lihat deploy/manajemen-risiko-api.service)
#   4. Sisipkan blok location di bawah ke server{} domain yang sudah ada,
#      ATAU pakai server{} contoh di bagian bawah file ini.
#   5. nginx -t && systemctl reload nginx
# =============================================================================

# ------- Sisipkan DUA blok berikut ke dalam server{} domain Anda -------------

# API backend — trailing slash pada proxy_pass MENGUPAS prefix '/manajemen-risiko/api',
# sehingga uvicorn tetap menerima path '/api/...' (backend tidak perlu diubah).
location /manajemen-risiko/api/ {
    proxy_pass         http://127.0.0.1:8077/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Prefix /manajemen-risiko;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
}

# Aset ber-hash (nama file mengandung hash) aman di-cache lama.
# Prefix-location + alias (bukan regex) agar try_files tetap andal.
location /manajemen-risiko/assets/ {
    alias /var/www/manajemen-risiko/dist/assets/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Frontend SPA — history mode: fallback ke index.html bila path bukan file.
location /manajemen-risiko/ {
    alias /var/www/manajemen-risiko/dist/;
    try_files $uri $uri/ /manajemen-risiko/index.html;
}

