; Supervisor — backend FastAPI (uvicorn) Manajemen Risiko
;
; Pasang:
;   sudo cp deploy/manajemen-risiko-api.supervisor.conf \
;           /etc/supervisor/conf.d/manajemen-risiko-api.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status manajemen-risiko-api
;
; Sesuaikan path (WorkingDirectory/venv), user, dan port bila perlu.
; Catatan: kredensial DB dsb. dibaca aplikasi sendiri dari BackEnd/.env
;          (app/core/config.py), jadi tidak perlu diset di sini.
; Jalankan SATU proses (numprocs=1) — captcha memakai store in-memory.

[program:manajemen-risiko-api]
command=/var/www/manajemen-risiko/BackEnd/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8077
directory=/var/www/manajemen-risiko/BackEnd
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
startretries=3
; uvicorn graceful shutdown; beri waktu proses berhenti rapi
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
; pastikan bin venv ada di PATH untuk subproses
environment=PATH="/var/www/manajemen-risiko/BackEnd/.venv/bin:%(ENV_PATH)s"
redirect_stderr=true
stdout_logfile=/var/log/manajemen-risiko-api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
